services:
  linkmusicbot:
    build: .
    image: linkmusicbot:local
    restart: unless-stopped
    init: true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - music_cache:/app/data
      - ./config.py:/app/config.py:ro
volumes:
  music_cache:
