services:
  linkmusicbot:
    image: linkmusicbot:local
    restart: unless-stopped
    init: true
    env_file:
      - ./bot.env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - music_cache:/app/data
volumes:
  music_cache:
